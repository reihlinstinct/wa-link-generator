<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://wa-link-generator.reihlinstinct.workers.dev; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>מחולל קישורי וואטסאפ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">דלג לתוכן</a>
<header>
<h1 data-i18n="title">מחולל קישורי וואטסאפ</h1>
<label for="lang" data-i18n="language">שפה</label>
<select id="lang"></select>
<p data-i18n="intro"></p>
</header>
<main id="main">
<section aria-labelledby="h-contact">
<h2 id="h-contact" data-i18n="who">למי</h2>
<label for="contact" data-i18n="contact">איש קשר</label>
<select id="contact"></select>
<label class="inline"><input type="checkbox" id="usename" checked> <span data-i18n="useName"></span></label>
<details>
<summary data-i18n="addContact">הוספת איש קשר</summary>
<label for="cname" data-i18n="name">שם</label><input id="cname" autocomplete="off" maxlength="40">
<label for="cphone" data-i18n="phone">מספר וואטסאפ</label><input id="cphone" inputmode="tel" dir="ltr" placeholder="05X XXX XXXX" autocomplete="off" maxlength="20">
<button type="button" id="add" data-i18n="add">הוסף</button>
<button type="button" id="remove" data-i18n="remove">מחק</button>
<p class="note" data-i18n="localNote"></p>
<button type="button" id="share" data-i18n="share"></button>
<p id="sharebox" class="note" dir="ltr"></p>
</details>
</section>
<section aria-labelledby="h-topic">
<h2 id="h-topic" data-i18n="topic">נושא</h2>
<label for="topic" data-i18n="topicLabel">נושא ההודעות</label>
<select id="topic"></select>
</section>
<section aria-labelledby="h-msg">
<h2 id="h-msg" data-i18n="message">הודעה</h2>
<label for="msg" data-i18n="text">נוסח</label>
<textarea id="msg" rows="4"></textarea>
<div class="row">
<button type="button" id="rand" data-i18n="regen"></button>
<button type="button" id="copy" data-i18n="copy"></button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<a id="go" class="go" href="#" rel="noopener noreferrer" data-i18n="open"></a>
</section>
</main>
<footer>
<p data-i18n="footer"></p>
<p><a href="https://github.com/reihlinstinct/wa-link-generator" rel="noopener noreferrer" data-i18n="source">Source code on GitHub</a> · <span data-i18n="license">MIT</span></p>
</footer>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
