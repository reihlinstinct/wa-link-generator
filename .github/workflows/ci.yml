name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Phone numbers only in the public contacts file (checked in npm test)
        run: "! grep -rEn --exclude-dir=.git --exclude-dir=test --exclude-dir=worker --exclude=contacts.json '(\\+?972|\\b05[0-9])[0-9 -]{7,}' ."
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
